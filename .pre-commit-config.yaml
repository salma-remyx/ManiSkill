# Defines automated checks run before repository changes are committed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: local
    hooks:
      - id: check-env-api-sync
        name: check BaseEnv and make API synchronization
        entry: python tools/pre_commit/check_env_api_sync.py
        language: python
        pass_filenames: false
        files: ^(mani_skill/envs/(base_env|make)\.py|tools/pre_commit/check_env_api_sync\.py)$
